name: Security review (Claude)
# AI security review of every pull request using anthropics/claude-code-security-review.
# Needs repository secret CLAUDE_API_KEY. Findings are posted as PR comments.
on: { pull_request: }
permissions: { contents: read, pull-requests: write }
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.head.sha || github.sha }}", fetch-depth: 2 }
      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
