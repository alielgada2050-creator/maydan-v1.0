<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-10i1CQlQBqyZ+CUwRqPl8YAVcdJ392dEwkLFNP7Bru8=' https://unpkg.com https://accounts.google.com/gsi/client; style-src 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; font-src https://fonts.gstatic.com; img-src data: https://unpkg.com https://*.tile.openstreetmap.org https://tile.googleapis.com https://maps.gstatic.com; connect-src https: http://localhost:* http://127.0.0.1:*; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta name="maydan-server" content="0">
<title>ميدان | إدارة الفرق والمعدات والخدمات اللوجستية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
:root{
  --ink:#0B1626;--ink2:#13243A;--ink3:#1E3350;--bg:#F4F6F8;--card:#FFFFFF;--line:#DDE3EA;--line2:#E2E8F0;
  --tx:#0F172A;--mut:#475569;--acc:#C2410C;--acc2:#9A3412;--accs:#FFF1E8;--blue:#1D4ED8;--green:#15803D;--red:#B91C1C;
  --ok-bg:#DCFCE7;--ok-tx:#14532D;--warn-bg:#FEF3C7;--warn-tx:#78350F;--bad-bg:#FEE2E2;--bad-tx:#7F1D1D;--info-bg:#DBEAFE;--info-tx:#1E3A8A;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
a{color:var(--acc)}
h1,h2,h3{margin:0;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;font-size:14px;font-weight:600;text-decoration:none;color:var(--tx);transition:transform 160ms var(--ease-out),background-color 150ms ease;user-select:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn.tg{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (hover:hover) and (pointer:fine){.btn:hover{background:#F8FAFC}.btn.pri:hover{background:var(--acc2)}.btn.dark:hover{background:var(--ink3)}.btn.wa:hover{background:#166534}.btn.tg:hover{background:#1E40AF}}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:13px;font-weight:600}
.fld .hint{font-size:12px;color:var(--mut)}
.in{min-height:44px;border:1px solid #CBD5E1;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;width:100%}
textarea.in{padding:10px 12px;min-height:90px;resize:vertical}
.ltr{direction:ltr;text-align:right}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok-tx)}.warn{background:var(--warn-bg);color:var(--warn-tx)}.bad{background:var(--bad-bg);color:var(--bad-tx)}.info{background:var(--info-bg);color:var(--info-tx)}.mutp{background:#F1F5F9;color:#334155}
.t-ok{color:var(--ok-tx);font-weight:600}.t-mut{color:var(--mut)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.kv{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}.kv>span:first-child{color:var(--mut)}
.tblw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td:last-child{white-space:nowrap}
th{text-align:right;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.empty{padding:24px;text-align:center;color:var(--mut);font-size:14px;border:1px dashed #CBD5E1;border-radius:12px}

/* shell */
.shell{display:flex;flex-wrap:wrap;min-height:100dvh}
.nav{flex:1 1 236px;max-width:100%;background:var(--ink);color:#E2E8F0;padding:22px 14px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-size:22px;color:#fff}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#CBD5E1;font-size:15px;text-align:right;transition:background-color 150ms ease}
.nav button[aria-current="page"]{background:var(--ink3);color:#fff;font-weight:600}
@media (hover:hover) and (pointer:fine){.nav button:hover{background:var(--ink2)}}
.nav .me{margin-top:auto;padding:12px;border-radius:10px;background:var(--ink2);font-size:13px;line-height:1.7;color:#CBD5E1}
.badge-n{margin-inline-start:auto;background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.main{flex:999 1 640px;min-width:0;padding:26px 28px;display:flex;flex-direction:column;gap:18px}

.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.ph p{font-size:14px;color:var(--mut);margin-top:4px}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split>.wide{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.split>.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}

/* auth */
.auth{display:flex;flex-wrap:wrap;min-height:100dvh}
.auth .hero{flex:1 1 460px;background:var(--ink);color:#F8FAFC;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth .hero h1{font-size:40px;line-height:1.3}
.auth .hero p{font-size:17px;line-height:1.8;color:#CBD5E1;max-width:520px;margin-top:14px}
.auth .hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;font-size:15px;color:#E2E8F0}
.auth .hero li{display:flex;gap:12px;align-items:flex-start;line-height:1.7}
.auth .pane{flex:999 1 520px;display:flex;align-items:center;justify-content:center;padding:40px 18px}
.auth .box{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px;display:flex;flex-direction:column;gap:18px}
@media (max-width:640px){.auth .hero{padding:32px 22px}.auth .hero h1{font-size:28px}.auth .box{padding:24px}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0;font-size:13px}
.steps li{display:flex;flex-direction:column;gap:6px;color:#64748B}
.steps li::before{content:"";height:4px;border-radius:2px;background:#E2E8F0}
.steps li.on{color:var(--tx);font-weight:600}.steps li.on::before{background:var(--acc)}
.otp{font-size:28px;letter-spacing:14px;text-align:center;direction:ltr;min-height:56px}
.alert{padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.7}
.alert.err{background:#FEF2F2;color:#991B1B}.alert.note{background:#EFF6FF;color:var(--info-tx)}.alert.okk{background:var(--ok-bg);color:var(--ok-tx)}.alert.wr{background:var(--warn-bg);color:var(--warn-tx)}
.chans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chan{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:64px;padding:12px 14px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;text-align:right}
.chan[aria-checked="true"]{border:2px solid var(--acc);background:var(--accs)}

/* map */
#map{height:560px;border-radius:16px;border:1px solid var(--line);background:#E9EEF3}
.mapfb{height:560px;border-radius:16px;border:1px dashed #CBD5E1;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;padding:20px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#334155;list-style:none;margin:0;padding:0}
.legend li{display:flex;align-items:center;gap:6px}.dot{width:12px;height:12px;border-radius:6px;display:inline-block}
.notif{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.notif.open{border:2px solid var(--acc)}
.notif h3{font-size:15px;line-height:1.6}
.notif .body{font-size:13px;line-height:1.8;color:#334155}

/* crews */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CBD5E1;background:#fff;font-size:13px;transition:transform 160ms var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.crewbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;text-align:right}
.crewbtn[aria-pressed="true"]{border:2px solid var(--acc)}
.crewbtn .nm{font-size:15px;font-weight:700}
.worker{border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.worker .top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px}
.worker .dyna{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:center;padding:10px 14px;background:#F8FAFC;border-top:1px dashed #CBD5E1;font-size:13px}
.worker .nody{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#FEF2F2;border-top:1px dashed #FCA5A5;font-size:13px;color:var(--bad-tx)}
@media (max-width:900px){.worker .dyna{grid-template-columns:repeat(2,minmax(0,1fr))}}
.carbox{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line2)}
@media (max-width:900px){.carbox{grid-template-columns:repeat(2,minmax(0,1fr))}}
.movep{background:#FFF7ED;border:2px solid var(--acc);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.lnk{font-size:13px;font-weight:600;text-decoration:none}
.lnk.w{color:var(--ok-tx)}.lnk.t{color:var(--info-tx)}

/* jobs */
.jobs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.job{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:#F8FAFC}
.job[draggable="true"]{cursor:grab}
.job.drag{opacity:.5}
.num{width:28px;height:28px;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* ai */
.prov{display:grid;grid-template-columns:auto minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
@media (max-width:1000px){.prov{grid-template-columns:minmax(0,1fr)}}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.9;white-space:pre-line;max-width:92%}
.msg.q{align-self:flex-start;background:var(--ink);color:#fff}
.msg.a{align-self:flex-end;background:#F1F5F9}

/* dialog & toast */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);box-shadow:0 20px 60px rgba(15,23,42,.3)}
dialog::backdrop{background:rgba(11,22,38,.45)}
dialog[open]{animation:dlgIn 200ms var(--ease-out)}
@keyframes dlgIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px}
#toasts{position:fixed;left:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:9999;max-width:min(440px,92vw)}
.toast{padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(15,23,42,.18);transition:opacity 150ms ease,transform 200ms var(--ease-out)}
.toast.ok{background:var(--ok-bg);color:var(--ok-tx)}.toast.err{background:var(--bad-bg);color:var(--bad-tx)}.toast.info{background:var(--ink);color:#fff}

/* v3 */
/* header */
.hero-h{position:relative;border-radius:18px;overflow:hidden;min-height:150px;background:#0B1626 center/cover no-repeat;color:#fff;box-shadow:0 6px 24px rgba(11,22,38,.18)}
.hero-h::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,22,38,.25) 0%,rgba(11,22,38,.72) 55%,rgba(11,22,38,.92) 100%)}
[dir="ltr"] .hero-h::before{background:linear-gradient(270deg,rgba(11,22,38,.25) 0%,rgba(11,22,38,.72) 55%,rgba(11,22,38,.92) 100%)}
.hero-h.nocover{background:linear-gradient(135deg,#0B1626,#1E3350)}
.hh-in{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;min-height:150px}
.hh-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.hh-logos{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:rgba(255,255,255,.95);border-radius:12px;padding:8px 14px;width:fit-content;max-width:100%}
.hh-logos img{max-width:180px}
.hh-title{display:flex;flex-direction:column;gap:2px}.hh-title b{font-size:22px;letter-spacing:0}.hh-title span{font-size:13px;color:#E2E8F0}
.hh-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:end}
.hh-date{font-size:13px;color:#E2E8F0}.hh-user{font-size:13px;font-weight:600;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px}.hh-scope{font-size:12px;color:#CBD5E1;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh-btn{min-width:40px;height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(11,22,38,.45);color:#fff;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.hh-btn:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){.hh-btn:hover{background:rgba(255,255,255,.18)}}
@media (max-width:640px){.hh-side{align-items:flex-start;text-align:start}.hh-title b{font-size:18px}}
.auth .hero{background-size:cover;background-position:center}
/* dark mode */
html[data-theme="dark"]{--bg:#0B1220;--card:#111A2B;--line:#24324A;--line2:#1E2A3F;--tx:#E5E7EB;--mut:#9FB0C6;--accs:#2A1B12;--ok-bg:#0F2E1C;--ok-tx:#86EFAC;--warn-bg:#33270B;--warn-tx:#FCD34D;--bad-bg:#3A1414;--bad-tx:#FCA5A5;--info-bg:#132A4A;--info-tx:#93C5FD;color-scheme:dark}
html[data-theme="dark"] body{background:var(--bg);color:var(--tx)}
html[data-theme="dark"] .card,html[data-theme="dark"] .notif,html[data-theme="dark"] .worker,html[data-theme="dark"] .crewbtn,html[data-theme="dark"] .prov,html[data-theme="dark"] .logo-item,html[data-theme="dark"] .auth .box,html[data-theme="dark"] dialog,html[data-theme="dark"] .chan{background:var(--card);color:var(--tx);border-color:var(--line)}
html[data-theme="dark"] .in,html[data-theme="dark"] .btn,html[data-theme="dark"] .chip{background:#0F1726;color:var(--tx);border-color:#334155}
html[data-theme="dark"] .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}html[data-theme="dark"] .btn.dark{background:#E5E7EB;border-color:#E5E7EB;color:#0B1626}
html[data-theme="dark"] .chip[aria-pressed="true"]{background:#E5E7EB;color:#0B1626;border-color:#E5E7EB}
html[data-theme="dark"] .btn.ghost{background:transparent;border-color:transparent}
html[data-theme="dark"] .tabs{background:#1A2538}html[data-theme="dark"] .tabs button{color:#CBD5E1}html[data-theme="dark"] .tabs button[aria-selected="true"]{background:var(--card);color:#fff}
html[data-theme="dark"] th{color:var(--mut)}html[data-theme="dark"] td{border-color:#1E2A3F}
html[data-theme="dark"] .mutp{background:#1E293B;color:#CBD5E1}
html[data-theme="dark"] .worker .dyna,html[data-theme="dark"] .carbox,html[data-theme="dark"] .job,html[data-theme="dark"] .reqdoc,html[data-theme="dark"] .msg.a{background:#0F1726;border-color:var(--line2);color:var(--tx)}
html[data-theme="dark"] .worker .nody,html[data-theme="dark"] .reqdoc.bad{background:#2A1212;border-color:#7F1D1D;color:#FECACA}html[data-theme="dark"] .reqdoc.ok{background:#0F2418;border-color:#166534}
html[data-theme="dark"] .alert.err{background:#3A1414;color:#FECACA}html[data-theme="dark"] .alert.note{background:#132A4A;color:#BFDBFE}
html[data-theme="dark"] .movep{background:#22160D}
html[data-theme="dark"] .ftable th{background:#1A2538;color:var(--tx)}html[data-theme="dark"] .ftable th,html[data-theme="dark"] .ftable td{border-color:#334155}
html[data-theme="dark"] .gauge svg circle:first-child{stroke:#1E293B}html[data-theme="dark"] .gauge svg text{fill:#E5E7EB}html[data-theme="dark"] .gauge svg text+text{fill:#9FB0C6}
html[data-theme="dark"] [style*="background:#EEF2F6"]{background:#1E293B!important}
html[data-theme="dark"] [style*="background:#FFF7ED"],html[data-theme="dark"] [style*="background:#fff"]{background:#1A2233!important}
html[data-theme="dark"] [style*="color:#334155"],html[data-theme="dark"] [style*="color: #334155"]{color:#CBD5E1!important}
html[data-theme="dark"] .who{color:#CBD5E1}
html[data-theme="dark"] .empty{border-color:#334155}
html[data-theme="dark"] #map{filter:brightness(.82) contrast(1.05)}

.stg{display:flex;flex-direction:column;gap:6px;padding:14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:13px;color:var(--mut)}.stg b{font-size:15px;color:var(--ink)}.stg.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}.stg.dis{opacity:.5;cursor:not-allowed}.stg input{accent-color:var(--acc)}
.hh-btn.gwb{width:auto;padding:0 12px;font-size:12px;font-weight:600}.hh-btn.gwb.bad{background:#B91C1C;border-color:#B91C1C}.hh-btn.gwb.wr{opacity:.85}
.gsep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}.gsep::before,.gsep::after{content:'';flex:1;height:1px;background:var(--line)}.gbtn{display:flex;justify-content:center;min-height:44px}
html[data-theme="dark"] .leaflet-tooltip{background:#111A2B;color:#E5E7EB;border-color:#334155}
@media print{html[data-theme="dark"] body,html[data-theme="dark"] dialog,html[data-theme="dark"] .ftable th{background:#fff!important;color:#000!important}}

.btn.wa:not(.txt),.btn.tg:not(.txt),.lnk.w,.lnk.t{font-size:0;width:34px;min-width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;text-decoration:none;flex:0 0 auto;transition:transform 160ms var(--ease-out)}
.btn.wa:not(.txt),.lnk.w{background:#16A34A}.btn.tg:not(.txt),.lnk.t{background:#2563EB}

const H = (h) => String(h || '').trim().toLowerCase();
function pickCol(head, names) { for (const n of names) { const i = head.findIndex((h) => H(h) === n || H(h).includes(n)); if (i > -1) return i; } return -1; }

function importEmployees(rows) {
  const head = rows[0].map(H); const body = rows.slice(1);

  if (ci.name < 0) throw new Error('لم يُعثر على عمود الاسم (name)');

  body.forEach((r) => {
    const g = (k) => (ci[k] > -1 ? String(r[ci[k]] == null ? '' : r[ci[k]]).trim() : '');
    const sp = splitNameIqama(g('name')); const iq = (validIqama(g('iq')) ? g('iq') : '') || sp.iqama; if (!sp.name) return;
    const mobile = normPhone(g('mobile')); const wp = g('wphone');
    const rec = { odooId: g('id').slice(0, 80), name: sp.name.slice(0, 100), iqama: iq, job: g('job').slice(0, 60), branch: g('dept').slice(0, 60), email: /@/.test(g('email')) ? g('email').slice(0, 120) : '', phone: validPhone(mobile) ? mobile : (validPhone(normPhone(wp)) ? normPhone(wp) : ''), empNo: /^\d+\/\d+$/.test(wp) ? wp : '', managerIqama: splitNameIqama(g('mgr')).iqama };
    res.total++; if (!rec.iqama) res.noIqama++; if (!rec.phone) res.noPhone++;
    const ex = DB.employees.find((e) => (rec.odooId && e.odooId === rec.odooId) || (rec.iqama && e.iqama === rec.iqama));

function normName(n) { return String(n || '').replace(/^\s*م\s*[./]?\s*/, '').replace(/\s+/g, ' ').trim(); }
function personIs(p, u) {
  if (!p || !u) return false;
  if (p.iqama && u.iqama && p.iqama === u.iqama) return true;
  if (p.phone && u.phone && normPhone(String(p.phone)) === normPhone(String(u.phone))) return true;
  return !!(p.name && u.name && normName(p.name).length > 3 && normName(p.name) === normName(u.name));
}
function scopeAll(u) { u = u || CUR; if (!u) return false; if (u.role === 'admin' || u.role === 'ops' || u.role === 'hr') return true; const s = u.scope || {}; return u.role === 'pm' && !(s.projects || []).length && !(s.offices || []).length && !(s.crews || []).length; }
function crewInScope(c, u) {
  u = u || CUR; if (!u || !c) return false; if (scopeAll(u)) return true;
  const s = u.scope || {};
  if ((s.crews || []).includes(c.id)) return true;
  if (u.role === 'pm' || u.role === 'viewer') return (s.projects || []).includes(c.projectId) || (s.offices || []).includes(c.branch);
  if (u.role === 'eng') return personIs(c.eng, u) || (s.projects || []).includes(c.projectId);
  if (u.role === 'sup') return personIs(c.sup, u);
  return false;

// coordination: same district / station / plan / plot, or within r km
function flNeighbors(j, r) {
  return flJobs().filter((o) => o.id !== j.id && flActive(o) && Math.abs(daysTo(o.date) - daysTo(j.date)) <= 7).map((o) => {
    const dist = flHasXY(j) && flHasXY(o) ? km(j, o) : null; const why = [];
    if (j.district && o.district === j.district) why.push('نفس الحي');
    if (j.station && o.station === j.station) why.push('نفس المحطة');
    if (j.plan && o.plan === j.plan) why.push('نفس المخطط');
    if (j.plot && o.plot === j.plot && o.plan === j.plan) why.push('نفس القطعة');
    if (dist !== null && dist <= r) why.push(dist <= cfg().flow.r1 ? 'ضمن ' + cfg().flow.r1 + ' كم' : 'ضمن ' + r + ' كم');
    return { o, dist, why };

// scheduler: runs on sign-in and every 5 minutes — tomorrow's alerts, permit expiry, attach-later deadlines, report deadlines

// clusters: single-linkage within clusterKm, or same station / plan
function flClusters(list, kmMax) {
  const P = list.filter(flHasXY); const parent = P.map((_, i) => i); const f = (i) => (parent[i] === i ? i : (parent[i] = f(parent[i])));
  for (let a = 0; a < P.length; a++) for (let b = a + 1; b < P.length; b++) {
    const x = P[a], y = P[b];
    if (km(x, y) <= kmMax || (x.station && x.station === y.station) || (x.plan && x.plan === y.plan && x.district === y.district)) parent[f(a)] = f(b);
  }
  const g = {}; P.forEach((j, i) => { (g[f(i)] = g[f(i)] || []).push(j); });
  return Object.values(g).map((jobs) => {
    const lat = jobs.reduce((s, j) => s + j.lat, 0) / jobs.length, lng = jobs.reduce((s, j) => s + j.lng, 0) / jobs.length;
    const rad = Math.max(0.35, ...jobs.map((j) => km({ lat, lng }, j))) + 0.25;
    const cnt = {}; jobs.forEach((j) => { cnt[j.district] = (cnt[j.district] || 0) + 1; }); const dist = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || '';
    return { jobs, lat, lng, rad, district: dist, offices: [...new Set(jobs.map((j) => j.office))], meters: jobs.reduce((s, j) => s + (+j.lengthM || 0), 0) };
  }).sort((a, b) => b.jobs.length - a.jobs.length);
}

function flSavings(clusters) { const trips = clusters.reduce((s, c) => s + Math.max(0, c.jobs.length - 1) * 5, 0); return { trips, sar: trips * FL_TRIP_SAR }; }

function hseTypes(j) {

function hseDocsFor(j) {

// ---------- document text extraction (docx / txt / best-effort pdf) ----------
async function hseFileText(file) {
  const n = file.name.toLowerCase(); if (file.size > 15 * 1024 * 1024) throw new Error('الملف أكبر من 15 ميجابايت');
  if (/\.(txt|md|csv)$/.test(n)) return (await file.text()).slice(0, 400000);
  if (n.endsWith('.docx')) { const z = await unzip(await file.arrayBuffer()); const x = await z.read('word/document.xml'); if (!x) throw new Error('ملف Word غير صالح');
    const doc = new DOMParser().parseFromString(x, 'application/xml'); return Array.from(doc.getElementsByTagName('w:p')).map((p) => Array.from(p.getElementsByTagName('w:t')).map((t) => t.textContent).join('')).filter(Boolean).join('\n').slice(0, 400000); }
  if (n.endsWith('.xlsx')) return (await readSheetFile(file)).map((r) => r.join(' | ')).join('\n').slice(0, 400000);
  if (n.endsWith('.pdf')) return pdfText(await file.arrayBuffer());
  throw new Error('الصيغ المدعومة: Word (.docx) أو PDF أو نص أو Excel');
}
async function pdfText(ab) {
  // simple extractor for text-based PDFs (Flate streams + Tj/TJ). Scanned PDFs need the text pasted.
  const u8 = new Uint8Array(ab); const s = new TextDecoder('latin1').decode(u8); const out = []; let i = 0, n = 0;
  while ((i = s.indexOf('stream', i)) > -1 && n < 3000) { n++;
    let a = i + 6; if (s[a] === '\r') a++; if (s[a] === '\n') a++; const e = s.indexOf('endstream', a); if (e < 0) break;
    const dict = s.slice(Math.max(0, i - 300), i); let data = u8.subarray(a, e);
    try { if (/FlateDecode/.test(dict)) { const ds = new DecompressionStream('deflate'); data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer()); } } catch (x) { i = e; continue; }
    const t = new TextDecoder('latin1').decode(data); const re = /\((?:\\.|[^\\)])*\)\s*Tj|\[(?:[^\]]*)\]\s*TJ/g; let m; const line = [];
    while ((m = re.exec(t))) { const parts = m[0].match(/\((?:\\.|[^\\)])*\)/g) || []; line.push(parts.map((p) => p.slice(1, -1).replace(/\\([nrtbf()\\])/g, (q, c) => ({ n: '\n', r: '', t: ' ', b: '', f: '', '(': '(', ')': ')', '\\': '\\' }[c]))).join('')); }
    if (line.length) out.push(line.join(' ')); i = e + 9;
  }
  const txt = out.join('\n'); try { return decodeURIComponent(escape(txt)).slice(0, 400000); } catch (e) { return txt.slice(0, 400000); }
}

const HSE_CAT_RE = {
  ppe: /خوذ|نظار|قفاز|حذاء|سترة|حزام أمان|كمام|واقي|helmet|glove|goggle|glasses|boots|shoes|vest|harness|mask|ear|ppe|مهمات الوقاية/i,
  permit: /تصريح|ptw|exc\b|loa\b|sft\b|wah\b|lop\b|csep|رخصة|permit/i,
  site: /حواجز|حاجز|لوح|إنارة|اناره|أقماع|تسوير|صبات|إشار|موقع|barrier|sign|light|cone|fenc|site|تحويل/i
};
const HSE_REQ_RE = /يجب|يلزم|ممنوع|لا يسمح|يتم|التأكد|توفير|ارتداء|استخدام|تطبيق|must|shall|ensure|provide|wear|use|apply|do not|never|required/i;
function hseAnalyze(text) {
  const T = String(text || ''); const low = T.toLowerCase();
  const hz = HAZARDS.map((h) => ({ id: h[0], n: h[7].reduce((s, k) => s + (low.split(k.toLowerCase()).length - 1), 0) })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const lines = T.split(/\n|(?<=[.؛;!؟])\s+/).map((x) => x.replace(/\s+/g, ' ').replace(/^[\s•▪●\-–\d.)(]+/, '').trim()).filter((x) => x.length >= 12 && x.length <= 260 && HSE_REQ_RE.test(x));
  const seen = new Set(); const items = [];
  lines.forEach((ln) => { const key = ln.slice(0, 60); if (seen.has(key)) return; seen.add(key);
    const cat = HSE_CAT_RE.ppe.test(ln) ? 'ppe' : HSE_CAT_RE.permit.test(ln) ? 'permit' : HSE_CAT_RE.site.test(ln) ? 'site' : 'work'; items.push({ cat, ar: ln }); });
  const codes = Object.keys(SAFETY_DOCS).filter((k) => new RegExp('\\b' + k.replace('PTW', '\\s*PTW') + '\\b', 'i').test(T.replace(/\./g, '')));
  return { hazards: hz.slice(0, 12), items: items.slice(0, 80), codes };
}

  const a = await aiChat([{ role: 'system', content: sys }, { role: 'user', content: String(text).slice(0, 24000) }]); if (!a) return null;
  const m = a.text.match(/\{[\s\S]*\}/); if (!m) return null;
  try { const o = JSON.parse(m[0]); const L = (x) => (Array.isArray(x) ? x.map((s) => String(s).trim().slice(0, 260)).filter((s) => s.length > 3).slice(0, 40) : []);

}

// attach several files (images / PDF / Word / Excel); images are geo-tagged
async function flAttachMany(j, kind, files, stage) {
  const ids = []; let geo = null; let noGeo = false;
  for (const f of files || []) {
    if (!f || !f.size) continue;
    const img = /^image\//.test(f.type); if (img && !geo && !noGeo) { geo = await geoNow(4000); if (!geo) noGeo = true; }
    const r = await flAttachAny(j, kind, f, { stage, geo: img ? geo : null }); if (typeof r === 'string') return r + ' (' + f.name + ')'; ids.push(r.id);
  }
  if (noGeo && ids.length) toast('حُفظت الصور دون موقع جغرافي — فعّل خدمة الموقع لتوثيقها.', 'err');
  return ids;
}

async function flAttachAny(j, kind, file, o) {
  if (!file || !file.size) return 'ملف فارغ.'; if (file.size > 15 * 1024 * 1024) return 'الملف أكبر من 15 ميجابايت.'; if (!FIELD_TYPES.test(file.type)) return 'المسموح: صور، PDF، Word، Excel.';
  o = o || {}; const stage = o.stage || j.stage || 'doc'; const name = flDocName(j, stage, file.name);
  let blob = file; try { blob = new File([file], name, { type: file.type }); } catch (e) { /* keep original */ }
  const doc = { id: uid('d'), type: kind, title: kind + ' — ' + (j.flow ? flFolderName(j) : j.title), crewId: j.crewId, taskId: j.id, workType: j.workType || '', person: CUR.name, exp: '', url: '', fileId: uid('f'), fileName: name, orig: safeName(file.name), mime: file.type, stage, geo: o.geo || null, size: file.size, form: null, tm: nowIso(), by: CUR.name };
  try { await filePut(doc.fileId, blob, j.id); } catch (e) { return 'تعذّر حفظ الملف.'; }
  DB.docs.unshift(doc); return doc;
}

async function doOtp(f) {

    return authErr('رمز غير صحيح. المحاولات المتبقية: ' + AUTH.tries);

async function issueActivation(u) {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const code = Array.from(rnd(8), (b) => alphabet[b % alphabet.length]).join('');
  const salt = b64e(rnd(12));

  u.active = false; delete u.hash; save();

}

function doMove() {

  }

async function aiChat(messages) {
  if (CLOUD) { try { const r = await api('/ai/chat', { method: 'POST', body: JSON.stringify({ messages }) }); return r && r.text ? { text: String(r.text), via: r.via || 'الخادم' } : null; } catch (e) { return null; } }

      const headers = { 'Content-Type': 'application/json' }; if (AI_KEYS[p.id]) headers.Authorization = 'Bearer ' + AI_KEYS[p.id]; if (p.id === 'openrouter') headers['X-Title'] = 'Maydan';

    } catch (e) { clearTimeout(tmo); }
  }

  if (r.lvl === 'bad') return { lvl: 'bad', label: 'متوقفة', reason: 'نقص معدات', note: r.text };
  const open = crewTasks(c.id).filter((j) => j.st !== 'done');
  const prog = open.filter((j) => j.st === 'prog'), holds = open.filter((j) => j.st === 'hold');
  if (prog.length) return { lvl: r.lvl === 'warn' ? 'warn' : 'ok', label: 'تعمل', reason: r.lvl === 'warn' ? 'مع تنبيهات صيانة' : '', note: '' };
  if (holds.length) return { lvl: 'bad', label: 'متوقفة', reason: holds[0].hold ? holds[0].hold.reason : 'غير محدد', note: holds[0].title };
  if (open.length) return { lvl: 'info', label: 'جاهزة', reason: 'بانتظار بدء المهام', note: '' };
  return { lvl: 'mutp', label: 'بلا مهام', reason: '', note: '' };
}
function productivity(c) {

  const done = crewTasks(c.id).filter((j) => j.st === 'done' && j.doneAt && new Date(j.doneAt) >= since);
  const onTime = done.filter((j) => dstr(j.doneAt) <= j.date).length;
  const docsAll = crewTasks(c.id).filter((j) => j.st !== 'done').map((j) => docStatus(j)).flat().filter((x) => x.need);
  return { done: done.length, onTime: done.length ? Math.round((onTime / done.length) * 100) : null, active: crewTasks(c.id).filter((j) => j.st !== 'done').length, docs: docsAll.length ? Math.round((docsAll.filter((x) => x.ok).length / docsAll.length) * 100) : null };
}
function docStatus(t) {
  const valid = (d) => !(d.exp && daysTo(d.exp) < 0);
  const has = (type) => DB.docs.some((d) => d.type === type && valid(d) && (d.taskId === t.id || (CREW_LEVEL_DOCS.includes(type) && !d.taskId && d.crewId && d.crewId === t.crewId) || (!d.taskId && !d.crewId && d.workType && d.workType === t.workType)));
  const dd = daysTo(t.date);
  return requiredDocsFor(t).map((type) => {
    if (type === 'تصريح') return { type, ok: (!!t.permit && !(t.permitExp && daysTo(t.permitExp) < 0)) || has('تصريح'), need: true };
    if (type === 'اجتماع ما قبل العمل') return { type, ok: DB.docs.some((d) => d.type === type && d.taskId === t.id && d.form && d.form.date === today()) || (dd > 0 && has(type)), need: dd <= 0 && t.st !== 'done' };
    return { type, ok: has(type), need: t.st !== 'done' };
  });
}

  });

const FILES_MEM = {};

function idb() { return new Promise((res, rej) => { const r = indexedDB.open('maydan_files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(id, blob) { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('f', 'readwrite'); tx.objectStore('f').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function filePut(id, blob, jobId) { if (DEMO) { FILES_MEM[id] = blob; return; } if (gwOn()) { await idbPut(id, blob); try { await gwUpload(id, blob, jobId); } catch (e) { toast('حُفظ الملف على الجهاز، وتعذّر رفعه إلى Google Drive: ' + e.message, 'err'); } return; } if (CLOUD) { const r = await fetch('/api/files', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': blob.type || 'application/octet-stream', 'X-Requested-With': 'maydan', 'X-File-Id': id, 'X-File-Name': encodeURIComponent(blob.name || 'file') }, body: blob }); if (!r.ok) throw new Error('upload ' + r.status); return; } const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction('f', 'readwrite'); tx.objectStore('f').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(id) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('f').objectStore('f').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function fileGet(id) { if (DEMO) return FILES_MEM[id]; if (!CLOUD && gcfg().files[id]) { let b = null; try { b = await idbGet(id); } catch (e) { /* none */ } if (b) return b; try { const r = await gfetch(GAPI + '/drive/v3/files/' + encodeURIComponent(gcfg().files[id].driveId) + '?alt=media'); return await r.blob(); } catch (e) { if (e.auth) toast(e.message, 'err'); return null; } } if (CLOUD) { const r = await fetch('/api/files/' + encodeURIComponent(id), { credentials: 'same-origin' }); if (r.ok) return r.blob(); } const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('f').objectStore('f').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function fileDel(id) { if (DEMO) { delete FILES_MEM[id]; return; } if (!CLOUD && gcfg().files[id]) { const d = gcfg().files[id].driveId; delete gcfg().files[id]; gfetch(GAPI + '/drive/v3/files/' + encodeURIComponent(d), { method: 'DELETE' }).catch(() => {}); } if (CLOUD) { fetch('/api/files/' + encodeURIComponent(id), { method: 'DELETE', credentials: 'same-origin', headers: { 'X-Requested-With': 'maydan' } }).catch(() => {}); return; } try { const db = await idb(); db.transaction('f', 'readwrite').objectStore('f').delete(id); } catch (e) { /* ignore */ } }

// ---------- gauges ----------
function gaugeValues() {

  const p30 = DB.jobs.filter((j) => j.st === 'done' && j.doneAt && Date.now() - new Date(j.doneAt) <= 30 * 864e5);
  const sNeed = open.filter((j) => daysTo(j.date) <= 1 && j.st !== 'hold'); const sOk = sNeed.filter((j) => { const r = j.reqs.find((x) => x.type === SAFE_IN); return r && r.st === 'done'; });
  const wk = DB.jobs.filter((j) => daysTo(j.date) <= 0 && daysTo(j.date) > -7);
  const linkTotal = DB.crews.length * 4 + DB.crews.reduce((a, c) => a + c.eq.length + c.workers.filter((w) => w.dyna).length, 0);
  return { crews: [DB.crews.filter((c) => crewState(c).label === 'تعمل').length, DB.crews.length, 'فرقة تعمل'], ready: [units.filter((u) => u.st !== 'shop' && (u.kind === 'سيارة' || u.driver)).length, units.length, 'معدة جاهزة بسائقها'],

  const emp = {}; DB.jobs.filter((j) => inRange(j) && j.st === 'done').forEach((j) => { const team = DB.docs.find((d) => d.taskId === j.id && d.form && d.form.members); const mem = team ? team.form.members : crewMembers(crewById(j.crewId)); mem.forEach((m) => { const k = m.iqama || m.name; emp[k] = emp[k] || { name: m.name, role: m.role, job: m.job, crew: j.crewId, done: 0 }; emp[k].done++; }); });

}

  const r = await (await gfetch(GAPI + '/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body })).json();
  g.files[id] = { driveId: r.id, link: r.webViewLink || 'https://drive.google.com/file/d/' + r.id + '/view' }; persistLocal();
}

    const fr = new FileReader(); fr.onload = () => { const url = String(fr.result); if (!/^data:image\/(png|jpeg|webp);base64,/.test(url)) return toast('صورة غير صالحة.', 'err'); const img = new Image(); img.onload = () => { const w = Math.min(1600, img.width), h = Math.round(img.height * (w / img.width)); const cv = document.createElement('canvas'); cv.width = w; cv.height = Math.min(h, 700); cv.getContext('2d').drawImage(img, 0, 0, w, h); let src = cv.toDataURL('image/webp', 0.72); if (!/^data:image\/webp/.test(src)) src = cv.toDataURL('image/jpeg', 0.75); if (!imgOk(src)) return toast('تعذّر معالجة الصورة.', 'err'); cfg().brand.cover = src; audit(CUR.name, 'تغيير صورة الهيدر', file.name); save(); render(); }; img.onerror = () => toast('صورة غير صالحة.', 'err'); img.src = url; }; fr.readAsDataURL(file); return; }
  if (k === 'fl-dist') { UI.flDist = el.value; return render(); }
  if (k === 'demo-as') return ACT['demo-as']({ k: el.value });
  if (k === 'hse-wt') { UI.hseWt = el.value; UI.hseAn = null; return render(); }
  if (k === 'inv-branch') { UI.invBranch = el.value; UI.invProj = ''; return render(); }
  if (k === 'inv-proj') { UI.invProj = el.value; return render(); }
  if (k === 'tx-done') { UI.txDone = el.checked; return render(); }
  if (k === 'tx-prev-wt' && UI.txPreview) { const r = UI.txPreview.rows[+el.dataset.i]; if (r) r.workType = el.value; return; }
  if (k === 'addable') { const n = el.form && el.form.elements[el.name + '__new']; if (n) { n.hidden = el.value !== '__new__'; if (!n.hidden) n.focus(); } }
  else if (k === 'move-driver' && UI.move) UI.move.withDriver = el.checked;
  else if (k === 'prov-on' && p) { p.on = el.checked; save(); }
  else if (k === 'prov-base' && p && can('settings')) { const v = el.value.trim(); if (/^https:\/\//.test(v) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(v)) { p.base = v; save(); } else { toast('العنوان يجب أن يبدأ بـ https:// أو http://localhost', 'err'); el.value = p.base; } }
  else if (k === 'prov-model' && p) { p.model = el.value.trim().slice(0, 200); save(); }
  else if (k === 'prov-key' && p) { AI_KEYS[p.id] = el.value.trim(); }
  else if (k === 'import' && el.files && el.files[0]) {
    if (!need('data')) return; const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!Array.isArray(d.crews) || !d.crews.every((c) => c && typeof c.id === 'string' && c.sup && c.sup.car && Array.isArray(c.eq) && Array.isArray(c.workers) && isFinite(c.lat) && isFinite(c.lng) && TYPES[c.type])) throw new Error('shape');
      DB.crews = d.crews; if (Array.isArray(d.jobs)) DB.jobs = d.jobs.filter((j) => j && typeof j.title === 'string' && JOB_ST[j.st]); if (Array.isArray(d.branches)) DB.branches = d.branches.filter((b) => typeof b === 'string'); audit(CUR.name, 'استيراد بيانات'); save(); toast('اُستوردت بيانات الفرق.'); render(); } catch (err) { toast('ملف غير صالح لبيانات ميدان.', 'err'); } };
    fr.readAsText(el.files[0].size > 5e6 ? new Blob() : el.files[0]);
  }
});
Object.assign(ACT, FL_ACT); Object.assign(FORMS, HSE_FORMS); applyActRules(ACT);
const INPUTS = { 'card-q': 'cardQ', 'eq-q': 'eqQ', 'tx-q': 'txQ', 'emp-q': 'empQ', 'fl-q': 'flQ', 'task-q': 'taskQ' };
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (!el || !INPUTS[el.dataset.input]) return; UI[INPUTS[el.dataset.input]] = el.value; const pos = el.selectionStart; const sel = '[data-input="' + el.dataset.input + '"]'; render(); const n = $(sel); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });
// drag & drop ordering for jobs
kbWire();
document.addEventListener('dragstart', (e) => { const li = e.target.closest && e.target.closest('[data-job]'); if (!li) return; UI.dragId = li.dataset.job; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', (e) => { if (UI.dragId && e.target.closest && e.target.closest('[data-job]')) e.preventDefault(); });
document.addEventListener('drop', (e) => { const li = e.target.closest && e.target.closest('[data-job]'); if (!li || !UI.dragId) return; e.preventDefault(); const from = DB.jobs.findIndex((j) => j.id === UI.dragId), to = DB.jobs.findIndex((j) => j.id === li.dataset.job); if (from > -1 && to > -1 && from !== to) { const [it] = DB.jobs.splice(from, 1); DB.jobs.splice(to, 0, it); save(); } UI.dragId = null; render(); });
document.addEventListener('dragend', () => { UI.dragId = null; document.querySelectorAll('.drag').forEach((x) => x.classList.remove('drag')); });

const lf = document.getElementById('lf');
if (lf && !window.L) lf.addEventListener('load', () => { if (CUR && UI.view === 'ops') mountMap(); });
(async () => {
  const h = await cloudDetect();
  if (h) { CLOUD = h; DB = freshDB(); DB.users = []; AUTH.step = h.needsSetup ? 'setup' : 'creds'; try { const me = await api('/auth/me'); if (me && me.user) { CUR = me.user; await cloudLoad(); UI.view = 'dash'; } } catch (e) { /* not signed in */ } }
  else { restore(); seedForms(); }
  if (!CUR && location.hash === '#demo') startDemo(); else render();
})();
window.addEventListener('hashchange', () => { if (!CUR && location.hash === '#demo') startDemo(); });
})();
