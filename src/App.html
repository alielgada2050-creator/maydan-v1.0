<script>
'use strict';
/* ================= ميدان — الواجهة =================
 * كل النصوص تُضاف عبر textContent (لا innerHTML لبيانات المستخدمين) لمنع XSS.
 * كل عملية تمر عبر api(token, action) على الخادم حيث تُفحص الصلاحيات.
 */
const S = {
  token: sessionStorage.getItem('maydan_t') || '',
  d: null, view: 'crews', sel: null, q: '', typeF: '', statusF: '', roleF: '',
  layers: { sup: true, cars: true, eq: true, drivers: true, workers: true },
  watch: null, lastSent: 0, map: null, mapLayer: null, refreshTimer: null
};

/* ---------- أدوات ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'value') el.value = v;
    else if (k === 'href') el.setAttribute('href', safeUrl(v));
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(Infinity).forEach(c => { if (c === null || c === undefined || c === false) return; el.append(c instanceof Node ? c : document.createTextNode(String(c))); });
  return el;
}
function safeUrl(u) { const s = String(u || ''); return /^(https:|tel:|mailto:|#)/i.test(s) ? s : '#'; }
const $app = () => document.getElementById('app');
function mount(node) { const a = $app(); a.replaceChildren(node); }
let toastT;
function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.className = 'toast alert ' + (kind || 'ok'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 4500);
}
function run(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(e && e.message || 'تعذّر الاتصال بالخادم')))[fn](...args));
}
async function call(action, payload) {
  const r = await run('api', S.token, action, payload || {});
  if (!r || !r.ok) {
    if (r && r.auth === false) { logout(true); }
    throw new Error((r && r.error) || 'خطأ');
  }
  return r.data;
}
async function act(action, payload, okMsg) {
  try { const d = await call(action, payload); if (okMsg) toast(okMsg); await refresh(); return d; }
  catch (e) { toast(e.message, 'err'); throw e; }
}
const C = () => S.d.config;
const byId = (arr, id) => arr.find(x => x.id === id);
const crewOf = id => byId(S.d.crews, id);
const personOf = id => byId(S.d.people, id);
const can = (...roles) => roles.includes(S.d.me.role);
function pill(text, kind) { return h('span', { class: 'pill p-' + kind }, text); }
function km(n) { return Number(n).toLocaleString('ar-SA'); }
const ICON_PIN = () => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', '30'); s.setAttribute('height', '30'); s.setAttribute('viewBox', '0 0 44 44'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<rect x="1" y="1" width="42" height="42" rx="11" fill="none" stroke="#F97316" stroke-width="2.5"/><path d="M22 10c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z" fill="none" stroke="#F8FAFC" stroke-width="2.5"/><circle cx="22" cy="19" r="3" fill="#F97316"/>'; return s; };

/* ---------- قواعد العرض ---------- */
function statusPill(st) { const m = { ok: 'ok', due: 'warn', shop: 'bad', out: 'bad' }; return pill(C().equipStatus[st] || st, m[st] || 'mute'); }
function oilPill(v) {
  if (v === '' || v === undefined) return pill('غير محدد', 'mute');
  const n = Number(v);
  if (n <= 0) return pill('متأخر ' + km(Math.abs(n)) + ' كم', 'bad');
  if (n <= C().oilWarnKm) return pill('بعد ' + km(n) + ' كم', 'warn');
  return h('span', {}, 'بعد ' + km(n) + ' كم');
}
function inspPill(d) {
  if (!d) return pill('غير محدد', 'mute');
  return d < C().today ? pill('منتهٍ ' + d, 'bad') : h('span', { style: 'color:#14532D;font-weight:600' }, 'ساري حتى ' + d);
}
function readyPill(r) { const m = { ready: ['جاهزة', 'ok'], warn: ['تعمل بتنبيه', 'warn'], stopped: ['متوقفة', 'bad'] }[r.state]; return pill(m[0], m[1]); }

/** وسيلة التواصل: رقم الفرد، وإن لم يوجد فرقم مراقب فرقته */
function contactOf(p) {
  if (p && p.phone) return { phone: p.phone, via: '' };
  const crew = p && crewOf(p.crewId);
  const sup = crew && personOf(crew.supervisorId);
  if (sup && sup.phone && sup.id !== p.id) return { phone: sup.phone, via: 'عبر المراقب ' + sup.name };
  return null;
}
function contactBtns(p, small) {
  const c = contactOf(p);
  if (!c) return h('span', { class: 'hint' }, 'لا يوجد رقم');
  const cls = small ? ' sm' : '';
  const who = p ? p.name : '';
  return h('span', { class: 'inline' },
    h('a', { class: 'btn' + cls, href: 'tel:+' + c.phone, 'aria-label': 'اتصال ' + who }, 'اتصال'),
    h('a', { class: 'btn wa' + cls, href: 'https://wa.me/' + c.phone, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'واتساب ' + who }, 'واتساب'),
    h('a', { class: 'btn tg' + cls, href: 'https://t.me/+' + c.phone, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'تليجرام ' + who }, 'تليجرام'),
    c.via ? h('span', { class: 'hint' }, c.via) : null);
}

/* ================= الدخول ================= */
function renderLogin(err) {
  let step = 1, iqama = '', channel = 'email', sentTo = '';
  const box = h('div', { class: 'card' });
  const brand = h('section', { class: 'brand' },
    h('div', { class: 'logo' }, ICON_PIN(), h('div', {}, h('b', {}, 'ميدان'), h('div', { style: 'font-size:13px;color:#CBD5E1' }, 'MAYDAN · Field Operations'))),
    h('div', { class: 'stack', style: 'max-width:520px' }, h('h1', {}, 'كل فرقة، كل معدة، كل موقع — في ميدان واحد.'), h('p', {}, 'إدارة الفرق والمعدات والخدمات اللوجستية لمشاريع البنية التحتية، تعمل على خوادم Google وتحفظ سجلاتها في Google Sheets وDrive.')),
    h('p', { style: 'font-size:14px' }, 'كل عملية دخول مسجّلة في سجل التدقيق.'));
  function draw(msg, kind) {
    box.replaceChildren();
    const m = msg ? h('p', { class: 'alert ' + (kind || 'err'), role: 'alert' }, msg) : null;
    if (step === 1) {
      const inp = h('input', { id: 'iq', class: 'inp', inputmode: 'numeric', autocomplete: 'username', maxlength: '10', placeholder: '2xxxxxxxxx', style: 'direction:ltr;text-align:right;letter-spacing:2px;font-size:18px', value: iqama });
      const pick = (v) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(channel === v), onClick: () => { channel = v; iqama = inp.value; draw(); } }, v === 'email' ? 'البريد الإلكتروني' : 'رسالة SMS');
      const form = h('form', { class: 'stack', onSubmit: async (e) => {
        e.preventDefault(); iqama = inp.value.replace(/\D/g, '');
        if (!/^[12]\d{9}$/.test(iqama)) return draw('رقم الإقامة/الهوية يجب أن يكون 10 أرقام ويبدأ بـ 1 أو 2.');
        btn.disabled = true;
        try { const r = await run('authRequestOtp', iqama, channel); if (!r.ok) return draw(r.error); sentTo = r.sentTo; step = 2; draw(); }
        catch (x) { draw(x.message); }
      } },
        h('h2', { style: 'margin:0;font-size:24px' }, 'تسجيل الدخول'),
        h('p', { class: 'sub' }, 'أدخل رقم الإقامة أو الهوية، وسيصلك رمز دخول لمرة واحدة.'),
        h('div', { class: 'fld' }, h('label', { for: 'iq' }, 'رقم الإقامة / الهوية'), inp, h('span', { class: 'hint' }, '10 أرقام — تبدأ بـ 2 للإقامة أو 1 للهوية الوطنية')),
        h('div', { class: 'fld' }, h('span', { style: 'font-size:13px;font-weight:600' }, 'استلام الرمز عبر'), h('div', { class: 'inline', role: 'group' }, pick('email'), pick('sms'))),
        m);
      const btn = h('button', { class: 'btn pri', type: 'submit' }, 'إرسال رمز الدخول');
      form.append(btn,
        h('div', { style: 'display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px' }, h('hr', { style: 'flex:1;border:0;border-top:1px solid var(--line)' }), 'أو', h('hr', { style: 'flex:1;border:0;border-top:1px solid var(--line)' })),
        h('button', { type: 'button', class: 'btn', onClick: async () => {
          try { const r = await run('authGoogle'); if (!r.ok) return draw(r.error, 'warn'); afterLogin(r.token); } catch (x) { draw(x.message); }
        } }, 'الدخول بحساب Google'));
      box.append(form);
      setTimeout(() => inp.focus(), 50);
    } else {
      const inp = h('input', { id: 'otp', class: 'inp otp', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '••••••' });
      const btn = h('button', { class: 'btn pri', type: 'submit', style: 'flex:1' }, 'تحقق ودخول');
      box.append(h('form', { class: 'stack', onSubmit: async (e) => {
        e.preventDefault(); const code = inp.value.replace(/\D/g, '');
        if (code.length !== 6) return draw('أدخل الرمز كاملاً (6 أرقام).');
        btn.disabled = true;
        try { const r = await run('authVerifyOtp', iqama, code); if (!r.ok) return draw(r.error + (r.left !== undefined ? ' — محاولات متبقية: ' + r.left : '')); afterLogin(r.token); }
        catch (x) { draw(x.message); }
      } },
        h('h2', { style: 'margin:0;font-size:24px' }, 'رمز التحقق'),
        h('p', { class: 'sub' }, 'أُرسل الرمز إلى: ', h('b', { style: 'direction:ltr;unicode-bidi:embed' }, sentTo), ' — صالح 5 دقائق.'),
        h('div', { class: 'fld' }, h('label', { for: 'otp' }, 'الرمز'), inp), m,
        h('div', { class: 'inline' }, h('button', { type: 'button', class: 'btn', onClick: () => { step = 1; draw(); } }, 'رجوع'), btn)));
      setTimeout(() => inp.focus(), 50);
    }
  }
  draw(err);
  mount(h('div', { class: 'login' }, brand, h('section', { class: 'side' }, box)));
}
function afterLogin(token) { S.token = token; sessionStorage.setItem('maydan_t', token); boot(); }
async function logout(expired) {
  try { if (!expired) await run('authLogout', S.token); } catch (e) {}
  stopLive(); clearInterval(S.refreshTimer);
  S.token = ''; S.d = null; S.view = 'crews'; S.sel = null; S.q = ''; sessionStorage.removeItem('maydan_t');
  renderLogin(expired ? 'انتهت الجلسة. سجّل الدخول من جديد.' : '');
}

/* ================= الهيكل ================= */
const VIEWS = [
  { id: 'crews', name: 'الفرق ومعداتها', roles: ['admin', 'pm', 'eng', 'supervisor', 'viewer'] },
  { id: 'map', name: 'الخريطة والطلبات', roles: ['admin', 'pm', 'eng', 'supervisor', 'viewer'] },
  { id: 'jobs', name: 'ترتيب الأعمال', roles: ['admin', 'pm', 'eng', 'supervisor', 'viewer'] },
  { id: 'people', name: 'الأفراد', roles: ['admin', 'pm', 'eng', 'supervisor', 'viewer'] },
  { id: 'equipment', name: 'المعدات والسيارات', roles: ['admin', 'pm', 'eng', 'supervisor', 'viewer'] },
  { id: 'ai', name: 'الوكيل الذكي', roles: ['admin', 'pm', 'eng'] },
  { id: 'users', name: 'المستخدمون والصلاحيات', roles: ['admin'] },
  { id: 'audit', name: 'سجل الدخول والتدقيق', roles: ['admin', 'pm'] },
  { id: 'settings', name: 'الإعدادات والتكامل', roles: ['admin'] }
];

async function boot() {
  mount(h('div', { class: 'loading' }, 'جارِ تحميل البيانات…'));
  try { S.d = await call('bootstrap'); }
  catch (e) { if (S.token) renderLogin(e.message); return; }
  if (!S.sel && S.d.crews[0]) S.sel = (myCrew() || S.d.crews[0]).id;
  clearInterval(S.refreshTimer);
  S.refreshTimer = setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('.drawer')) refresh(); }, 60000);
  render();
}
async function refresh() { try { S.d = await call('bootstrap'); render(); } catch (e) {} }
function myCrew() { const pid = S.d && S.d.me.personId; return pid ? S.d.crews.find(c => c.supervisorId === pid) : null; }

function render() {
  if (!S.d) return;
  const me = S.d.me;
  const views = VIEWS.filter(v => v.roles.includes(me.role));
  if (!views.find(v => v.id === S.view)) S.view = views[0].id;
  const unread = S.d.notifications.filter(n => n.status === 'new').length;
  const nav = h('nav', { class: 'nav', 'aria-label': 'القائمة الرئيسية' },
    h('div', { class: 'logo' }, ICON_PIN(), h('b', { style: 'color:#fff;font-size:22px' }, 'ميدان')),
    h('ul', { style: 'list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px' },
      views.map(v => h('li', {}, h('a', { href: '#', 'aria-current': S.view === v.id ? 'page' : null, onClick: (e) => { e.preventDefault(); S.view = v.id; S.q = ''; S.statusF = ''; S.roleF = ''; render(); } }, v.name)))),
    h('div', { class: 'who' }, h('div', { style: 'color:#fff;font-weight:600' }, me.name), me.roleName));
  const live = myCrew() ? h('button', { class: 'btn sm' + (S.watch ? ' dark' : ''), onClick: toggleLive, 'aria-pressed': String(!!S.watch) }, S.watch ? 'الموقع الحي: يعمل' : 'مشاركة الموقع الحي') : null;
  const bar = h('div', { class: 'inline', style: 'justify-content:flex-end' },
    C().mode === 'demo' ? h('span', { class: 'demo' }, 'نسخة تجريبية — البيانات أمثلة') : null,
    live,
    h('button', { class: 'btn sm bell', onClick: openNotifs, 'aria-label': 'الإشعارات' }, 'الإشعارات', unread ? h('span', { class: 'cnt' }, unread) : null),
    h('button', { class: 'btn sm', onClick: () => logout(false) }, 'خروج'));
  const main = h('main', { class: 'main' }, bar);
  try { main.append(VIEW_FN[S.view]()); } catch (e) { main.append(h('p', { class: 'alert err' }, e.message)); }
  mount(h('div', { class: 'shell' }, nav, main));
  if (S.view === 'map') setTimeout(drawMap, 0);
}

/* ================= الفرق ومعداتها ================= */
function viewCrews() {
  const crews = S.d.crews.filter(c => (!S.typeF || c.type === S.typeF) && (!S.q || c.name.includes(S.q) || (c.district || '').includes(S.q)));
  const c = crewOf(S.sel) || crews[0];
  const head = h('div', { class: 'top' },
    h('div', {}, h('h1', {}, 'الفرق ومعداتها'), h('p', { class: 'sub' }, 'كل فرقة بمراقبها وسيارته، وعمالها، ومعداتها وسائقيها — فرقة بلا معدة عاملة لا تعمل.')),
    can('admin', 'pm', 'eng') ? h('button', { class: 'btn pri', onClick: () => editCrew() }, '+ فرقة جديدة') : null);
  const layerDefs = [['sup', 'المراقبون'], ['cars', 'سيارات المراقبين'], ['eq', 'المعدات'], ['drivers', 'السائقون'], ['workers', 'العمال والفنيون']];
  const layers = h('div', { class: 'inline', role: 'group', 'aria-label': 'الطبقات' }, h('span', { style: 'font-size:13px;font-weight:600' }, 'الطبقات:'),
    layerDefs.map(([k, n]) => h('button', { class: 'chip', 'aria-pressed': String(S.layers[k]), onClick: () => { S.layers[k] = !S.layers[k]; render(); } }, n)));
  const search = h('input', { class: 'inp', placeholder: 'بحث باسم الفرقة أو الحي', value: S.q, 'aria-label': 'بحث', onChange: e => { S.q = e.target.value.trim(); render(); } });
  const typeSel = h('select', { class: 'inp', 'aria-label': 'نوع الفرقة', onChange: e => { S.typeF = e.target.value; render(); } },
    h('option', { value: '' }, 'كل الأنواع'), Object.entries(C().crewTypes).map(([k, v]) => h('option', { value: k, selected: S.typeF === k ? 'selected' : null }, v)));
  const list = h('aside', { class: 'aside stack', 'aria-label': 'الفرق' }, search, typeSel,
    crews.length ? crews.map(x => {
      const ppl = S.d.people.filter(p => p.crewId === x.id).length, eqn = S.d.equipment.filter(e => e.crewId === x.id).length;
      return h('button', { class: 'crewbtn', 'aria-pressed': String(c && x.id === c.id), onClick: () => { S.sel = x.id; render(); } },
        h('span', { style: 'display:flex;justify-content:space-between;width:100%;gap:8px' }, h('b', {}, x.name), readyPill(x.readiness)),
        h('span', { class: 'hint' }, (C().crewTypes[x.type] || '') + ' · ' + ppl + ' أفراد · ' + eqn + ' معدات'),
        h('span', { class: 'hint' }, x.district || ''));
    }) : h('p', { class: 'hint' }, 'لا توجد فرق بعد.'));
  return h('div', { class: 'stack' }, head, layers, h('div', { class: 'row' }, list, h('section', { class: 'grow stack' }, c ? crewDetail(c) : h('p', { class: 'card' }, 'أضف أول فرقة للبدء.'))));
}

function crewDetail(c) {
  const sup = personOf(c.supervisorId), eng = personOf(c.engineerId);
  const branch = byId(S.d.branches, c.branchId);
  const eqAll = S.d.equipment.filter(e => e.crewId === c.id);
  const cars = eqAll.filter(e => e.ownerId);
  const eqs = eqAll.filter(e => !e.ownerId);
  const driverIds = new Set(eqAll.map(e => e.driverId).filter(Boolean));
  const workers = S.d.people.filter(p => p.crewId === c.id && p.id !== c.supervisorId && p.id !== c.engineerId && !driverIds.has(p.id));
  const canEdit = can('admin', 'pm', 'eng');
  const canPeople = canEdit || (S.d.me.role === 'supervisor' && myCrew() && myCrew().id === c.id);
  const tone = { ready: 'ok', warn: 'warn', stopped: 'err' }[c.readiness.state];
  const out = h('div', { class: 'stack' });

  out.append(h('div', { class: 'card stack' },
    h('div', { class: 'top' },
      h('div', {}, h('h2', { style: 'margin:0;font-size:22px' }, c.name), h('p', { class: 'sub' }, (C().crewTypes[c.type] || '') + ' · ' + (branch ? branch.name : 'بلا فرع') + ' · ' + (c.district || ''), eng ? ' · المهندس: ' + eng.name : '')),
      h('div', { class: 'inline' },
        canEdit ? h('button', { class: 'btn sm', onClick: () => editCrew(c) }, 'تعديل الفرقة') : null,
        canPeople ? h('button', { class: 'btn sm', onClick: () => updateLocation(c) }, 'تحديث الموقع') : null,
        c.lat ? h('a', { class: 'btn sm', href: 'https://www.google.com/maps?q=' + c.lat + ',' + c.lng, target: '_blank', rel: 'noopener noreferrer' }, 'Google Maps') : null,
        h('button', { class: 'btn sm', onClick: () => attachments('Crews', c.id, c.name) }, 'المرفقات'))),
    h('p', { class: 'alert ' + tone, role: 'status', style: 'margin:0' }, c.readiness.reason + (c.locAt ? ' · آخر موقع: ' + c.locAt.replace('T', ' ') : ''))));

  if (S.layers.sup) {
    out.append(h('div', { class: 'card stack' },
      h('h3', { style: 'margin:0;font-size:16px' }, 'المراقب'),
      sup ? h('div', { class: 'person' },
        h('span', { class: 'avatar' }, sup.name.replace(/^م[\/.]\s*/, '').charAt(0)),
        h('div', { style: 'flex:1;min-width:160px' }, h('b', {}, sup.name), h('div', { class: 'hint', style: 'direction:ltr;text-align:right' }, sup.phone ? '+' + sup.phone : 'لا يوجد رقم')),
        contactBtns(sup, true),
        canPeople ? h('button', { class: 'btn sm', onClick: () => editPerson(sup) }, 'تعديل') : null)
        : h('p', { class: 'alert warn', style: 'margin:0' }, 'لا يوجد مراقب. عدّل الفرقة لإسناد مراقب.'),
      S.layers.cars ? (cars.length ? cars.map(car => h('div', { class: 'kv' },
        h('div', {}, h('span', {}, 'سيارة المراقب'), h('b', {}, car.kind)),
        h('div', {}, h('span', {}, 'اللوحة / الرقم'), h('b', {}, car.plate || car.code)),
        h('div', {}, h('span', {}, 'الحالة'), statusPill(car.status)),
        h('div', {}, h('span', {}, 'غيار الزيت'), oilPill(car.oilRemainKm)),
        h('div', {}, h('span', {}, 'الفحص الدوري'), inspPill(car.inspExpiry)),
        canEdit ? h('div', {}, h('button', { class: 'btn sm', onClick: () => editEquipment(car) }, 'تعديل السيارة')) : null))
        : (canEdit && sup ? h('button', { class: 'btn sm', style: 'align-self:flex-start', onClick: () => editEquipment({ crewId: c.id, ownerId: sup.id, driverId: sup.id, kind: 'سيارة مراقب', status: 'ok' }) }, '+ إضافة سيارة المراقب') : null)) : null));
  }

  if (S.layers.eq) {
    out.append(h('div', { class: 'card stack' },
      h('div', { class: 'top' }, h('h3', { style: 'margin:0;font-size:16px' }, 'المعدات والسائقون · ' + eqs.length),
        canEdit ? h('button', { class: 'btn sm', onClick: () => editEquipment({ crewId: c.id, status: 'ok' }) }, '+ إضافة معدة للفرقة') : null),

  } }, h('h2', { style: 'margin:0;font-size:20px' }, title), grid, extra || null, err,

function parseLatLng(s) {
  const m = String(s).match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m ? { lat: m[1], lng: m[2] } : null;
}

    gps.disabled = true; gps.textContent = 'جارِ تحديد الموقع…';
    navigator.geolocation.getCurrentPosition(async pos => {
      try { await call('location.update', { crewId: c.id, lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) }); document.querySelector('.drawer').remove(); toast('تم تحديث الموقع'); await refresh(); }
      catch (x) { toast(x.message, 'err'); }
    }, err => { gps.disabled = false; gps.textContent = 'استخدام موقعي الحالي (GPS)'; toast('تعذّر تحديد الموقع: ' + err.message + ' — الصق رابط Google Maps بدلاً من ذلك', 'warn'); }, { enableHighAccuracy: true, timeout: 15000 });
  } }, 'استخدام موقعي الحالي (GPS)');
  modal('موقع ' + c.name, [{ key: 'link', label: 'أو الصق رابط Google Maps أو الإحداثيات', wide: true, ltr: true, ph: '24.8355, 46.6555', hint: 'من Google Maps: اضغط مطولاً على الموقع وانسخ الإحداثيات' }], {}, async (v) => {
    const ll = parseLatLng(v.link); if (!ll) throw new Error('لم أتعرف على الإحداثيات');
    await call('location.update', { crewId: c.id, lat: ll.lat, lng: ll.lng }); toast('تم تحديث الموقع'); await refresh();
  }, gps);
}
function toggleLive() {
  if (S.watch) { stopLive(); toast('أُوقفت مشاركة الموقع', 'info'); render(); return; }
  const c = myCrew(); if (!c || !navigator.geolocation) return toast('تحديد الموقع غير متاح', 'err');
  S.watch = navigator.geolocation.watchPosition(async pos => {
    if (Date.now() - S.lastSent < 60000) return;
    S.lastSent = Date.now();
    try { await call('location.update', { crewId: c.id, lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) }); } catch (e) {}
  }, err => { toast('تعذّر تحديد الموقع: ' + err.message, 'warn'); stopLive(); render(); }, { enableHighAccuracy: true, maximumAge: 30000 });
  toast('تتم مشاركة موقع فرقتك كل دقيقة أثناء فتح التطبيق', 'info'); render();
}
function stopLive() { if (S.watch !== null && navigator.geolocation) navigator.geolocation.clearWatch(S.watch); S.watch = null; }

let leafletP = null;

    const js = h('script', { src: 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', integrity: 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=', crossorigin: '' });
    js.onload = () => res(); js.onerror = () => { leafletP = null; rej(new Error('load')); };
    setTimeout(() => { if (typeof L === 'undefined') { leafletP = null; rej(new Error('timeout')); } }, 10000);
    document.head.append(css, js);

/* ================= المرفقات (Drive) ================= */
async function attachments(entity, id, label) {
  let list = [];
  try { list = await call('attach.list', { entity, entityId: id }); } catch (e) { return toast(e.message, 'err'); }
  const file = h('input', { type: 'file', id: 'upf', accept: 'image/jpeg,image/png,image/webp,application/pdf' });
  modal('مرفقات ' + label, [], {}, async () => {
    const f = file.files[0]; if (!f) throw new Error('اختر ملفاً');
    if (f.size > 5 * 1024 * 1024) throw new Error('الحد الأقصى 5 ميجابايت');
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
    await call('attach.upload', { entity, entityId: id, name: f.name, mime: f.type, base64: b64 }); toast('رُفع الملف إلى Drive');
  }, h('div', { class: 'stack' },
    list.length ? h('ul', { class: 'stack', style: 'margin:0;padding-inline-start:18px' }, list.map(a => h('li', {}, h('a', { href: a.url, target: '_blank', rel: 'noopener noreferrer' }, a.name), h('span', { class: 'hint' }, ' — ' + a.by + ' · ' + a.at.replace('T', ' '))))) : h('p', { class: 'hint' }, 'لا توجد مرفقات.'),
    h('label', { for: 'upf', style: 'font-size:13px;font-weight:600' }, 'رفع صورة أو PDF (يُحفظ في مجلد ميدان على Drive)'), file));
}
