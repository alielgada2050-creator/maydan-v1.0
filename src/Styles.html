<style>
:root{--ink:#0B1626;--ink2:#13243A;--ink3:#1E3350;--bg:#F4F6F8;--card:#FFFFFF;--line:#DDE3EA;--line2:#E2E8F0;--text:#0F172A;--muted:#475569;--acc:#C2410C;--acc2:#9A3412;--accs:#FFF1E8;--blue:#1D4ED8;--green:#15803D;--red:#B91C1C;--amber:#B45309}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.6}
a{color:var(--acc)}a:hover{color:var(--acc2)}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button:focus-visible,a:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #CBD5E1;background:#fff;cursor:pointer;text-decoration:none;color:var(--text);font-weight:500;white-space:nowrap}
.btn:hover{background:#F8FAFC}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}.btn.pri:hover{background:var(--acc2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.wa{border-color:var(--green);color:#14532D}.btn.tg{border-color:var(--blue);color:#1E3A8A}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #CBD5E1;background:#fff;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:#DCFCE7;color:#14532D}.p-warn{background:#FEF3C7;color:#78350F}.p-bad{background:#FEE2E2;color:#7F1D1D}.p-info{background:#DBEAFE;color:#1E3A8A}.p-mute{background:#F1F5F9;color:#334155}
/* inputs */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:600}
.inp{height:44px;border:1px solid #CBD5E1;border-radius:10px;padding:0 12px;background:#fff;width:100%}
textarea.inp{height:auto;min-height:80px;padding:10px 12px}
.hint{font-size:12px;color:var(--muted)}
/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.login .brand{flex:1 1 420px;background:var(--ink);color:#F8FAFC;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.login .brand h1{margin:0;font-size:38px;line-height:1.3}
.login .brand p{color:#CBD5E1;font-size:17px;line-height:1.8;margin:0}
.login .side{flex:999 1 480px;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.login .card{width:100%;max-width:440px;padding:36px;display:flex;flex-direction:column;gap:18px}
.otp{height:56px;font-size:28px;letter-spacing:14px;text-align:center;direction:ltr}
.alert{padding:12px 14px;border-radius:10px;font-size:14px}
.alert.err{background:#FEF2F2;color:#991B1B}.alert.ok{background:#DCFCE7;color:#14532D}.alert.info{background:#EFF6FF;color:#1E3A8A}.alert.warn{background:#FEF3C7;color:#78350F}
.logo{display:flex;align-items:center;gap:12px}
.logo b{font-size:26px}
/* shell */
.shell{display:flex;min-height:100vh}
.nav{flex:0 0 240px;background:var(--ink);color:#E2E8F0;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:8px;color:#CBD5E1;text-decoration:none}
.nav a[aria-current=page]{background:var(--ink3);color:#fff;font-weight:600}
.nav a:hover{color:#fff}
.nav .who{margin-top:auto;padding:12px;border-radius:10px;background:var(--ink2);font-size:13px;color:#CBD5E1}
.main{flex:1 1 auto;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.top h1{margin:0;font-size:26px}
.sub{margin:0;font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.grow{flex:999 1 560px;min-width:0}
.aside{flex:1 1 290px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.crewbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:right}
.crewbtn[aria-pressed=true]{border:2px solid var(--acc)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;color:var(--muted);font-size:13px;font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:12px;border-radius:12px;background:#F8FAFC;border:1px solid var(--line2);font-size:13px}
.kv span{color:var(--muted);display:block}
.person{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;flex-wrap:wrap}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
#map{height:560px;border-radius:16px;border:1px solid var(--line);z-index:0}
.bell{position:relative}
.bell .cnt{position:absolute;top:-4px;left:-4px;background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.drawer{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;z-index:1000;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2000;max-width:90vw;box-shadow:0 8px 24px rgba(15,23,42,.2)}
.demo{background:#FEF3C7;color:#78350F;padding:8px 14px;border-radius:10px;font-size:13px}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:860px){
  .shell{flex-direction:column}
  .nav{position:static;height:auto;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;gap:6px;padding:10px}
  .nav .who,.nav .logo{display:none}
  .nav ul{display:flex;flex-wrap:wrap;gap:4px}
  .nav a{min-height:40px;font-size:14px}
  .main{padding:16px}
  .modal .grid{grid-template-columns:1fr}
  .login .brand{padding:28px}
  #map{height:420px}
}
</style>
