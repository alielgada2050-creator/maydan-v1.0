name: CI — فحص ميدان

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build paste versions
        run: npm run build
      - name: Paste files must be committed up to date
        run: git diff --exit-code -- paste/
      - name: Tests (syntax, server scenario, merged Code.gs, UI)
        run: npm test
