  window.__maydanStarted = false;

    box.appendChild(p);
    var e = document.createElement('p'); e.className = 'hint'; e.textContent = 'التفاصيل: ' + (window.__maydanErr || 'لا توجد'); box.appendChild(e);
    a.appendChild(box);
  }, 12000);
  window.addEventListener('error', function (ev) { window.__maydanErr = (ev && ev.message) || 'خطأ غير معروف'; });
